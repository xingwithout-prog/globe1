<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HeCongHub Global</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0a0a14;font-family:'Rajdhani',sans-serif;color:#e0e0e0}

.main-container{display:flex;width:100%;height:100vh;overflow:hidden}
.globe-section{flex:1;position:relative;height:100vh}
#globe-container{width:100%;height:100%}

/* 核心优化：移动端嵌套滚动 */
.panel-section{width:420px;min-width:420px;max-width:420px;padding:30px;background:linear-gradient(90deg,rgba(10,10,20,0.95),rgba(10,12,28,0.9));border-left:1px solid rgba(255,255,255,0.08);overflow-y:auto;height:100vh;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}

.panel-header h2{font-size:26px;font-weight:700;color:#fff;margin-bottom:20px}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.stat-card{background:rgba(255,255,255,0.05);padding:15px;border-radius:12px;border:1px solid rgba(255,255,255,0.05)}
.stat-value{font-size:22px;font-weight:700;color:#00d4ff}
.stat-label{font-size:10px;color:#8890a8;text-transform:uppercase;margin-top:4px}

@media(max-width:900px){
    body{overflow:auto}
    .main-container{flex-direction:column;height:auto;overflow:visible}
    .globe-section{flex:none;width:100%;height:40vh;min-height:300px}
    .panel-section{width:100%;min-width:100%;height:auto;overflow-y:visible;border-left:none;border-top:1px solid rgba(255,255,255,0.08)}
}
</style>
</head>
<body>
<div class="main-container" id="mainContainer">
    <div class="globe-section"><div id="globe-container"></div></div>
    <div class="panel-section">
        <div class="panel-header"><h2>Global Operation</h2></div>
        <div class="stats-row">
            <div class="stat-card"><div class="stat-value">12,600+</div><div class="stat-label">Partners</div></div>
            <div class="stat-card"><div class="stat-value">3.85M</div><div class="stat-label">Shipments</div></div>
        </div>
        <div class="live-feed"><h4>Recent Transactions</h4><ul id="feedList" style="list-style:none;margin-top:10px;font-size:12px;color:#8890a8"></ul></div>
    </div>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const container = document.getElementById('globe-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, container.clientWidth/container.clientHeight, 0.1, 100);
camera.position.z = 2.5;

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setSize(container.clientWidth, container.clientHeight);
container.appendChild(renderer.domElement);

// 真实地球纹理
const texLoader = new THREE.TextureLoader();
const earthMat = new THREE.MeshPhongMaterial({
    map: texLoader.load('https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/Blue_Marble_2002.png/1280px-Blue_Marble_2002.png'),
    bumpMap: texLoader.load('https://threejs.org/examples/textures/planets/earth_normal_2048.jpg'),
    bumpScale: 0.05,
    specular: new THREE.Color(0x333333),
    shininess: 15
});

const globe = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 64), earthMat);
scene.add(globe);

// 云层
const cloudMesh = new THREE.Mesh(
    new THREE.SphereGeometry(1.02, 64, 64),
    new THREE.MeshPhongMaterial({
        map: texLoader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png'),
        transparent: true, opacity: 0.4
    })
);
scene.add(cloudMesh);

scene.add(new THREE.AmbientLight(0xffffff, 1.5));
const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(5, 3, 5);
scene.add(light);

const controls = new OrbitControls(camera, renderer.domElement);
controls.autoRotate = true;
controls.enablePan = false;

function animate() {
    requestAnimationFrame(animate);
    globe.rotation.y += 0.001;
    cloudMesh.rotation.y += 0.0015;
    controls.update();
    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
